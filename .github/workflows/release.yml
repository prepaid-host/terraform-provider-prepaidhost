# Release pipeline (HashiCorp provider scaffolding). Runs ONLY for a pushed tag
# `v*` (e.g. v0.1.0) — nothing else publishes anything. See RELEASING.md.
#
# GoReleaser builds the provider for all platforms, zips it, writes the
# SHA256SUMS file, signs that file with a detached binary GPG signature
# (.sig) and uploads everything, plus terraform-registry-manifest.json, to a
# published GitHub release. The Terraform Registry (via its release webhook)
# and the OpenTofu Registry ingest that release.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   GPG_PRIVATE_KEY  ASCII-armored private key (RSA — the Terraform Registry
#                    rejects ECC keys): gpg --armor --export-secret-keys <ID>
#   PASSPHRASE       passphrase of that key
name: Release

on:
  push:
    tags:
      - 'v*'

# Releases are created with the workflow's GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the tags to derive the version.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
